<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Cờ Caro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }
        
        /* Top Panel - Nằm gọn trên cùng */
        .top-bar {
            background: white;
            padding: 8px 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 10;
            width: 100%;
            box-sizing: border-box;
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #d32f2f;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .panel-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        button { padding: 6px 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 0.85rem; transition: background 0.2s;}
        button:hover { background: #0056b3; }
        
        input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; width: 90px; font-family: monospace; font-size: 1rem; text-align: center; font-weight: bold; text-transform: uppercase;}
        input:focus { outline: none; border-color: #007bff; }

        /* Online Panel */
        #online-panel { display: none; background: #e9ecef; padding: 4px 8px; border-radius: 6px; }
        
        /* ===== STYLE MỚI: MÀU NỀN PASTEL DỊU MẮT ===== */
        #status { 
            font-size: 0.95rem; 
            font-weight: bold; 
            padding: 6px 15px; 
            border-radius: 6px; 
            transition: all 0.3s ease-in-out;
            display: inline-block;
        }
        .status-default { color: #004085; background-color: #cce5ff; border: 1px solid #b8daff; } /* Xanh dương pastel (Máy) */
        .status-waiting { color: #856404; background-color: #fff3cd; border: 1px solid #ffeeba; }  /* Vàng pastel (Đợi) */
        .status-connected { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; } /* Xanh lá pastel (Đến lượt BẠN) */
        .status-disconnected { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; } /* Đỏ pastel (Mất kết nối) */

        /* Board Wrapper */
        #board-wrapper { 
            flex-grow: 1; 
            width: 100%; 
            max-width: 100%; 
            overflow: auto; 
            background: #999; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
            -webkit-overflow-scrolling: touch; 
            position: relative;
        }
        
        /* Board 40x40 */
        #board { 
            display: grid; 
            grid-template-columns: repeat(40, 35px); 
            grid-template-rows: repeat(40, 35px); 
            gap: 1px; 
            background: #666; 
            padding: 1px; 
            width: max-content; 
            margin: auto; 
            position: relative;
        }
        
        /* Cells */
        .cell { 
            width: 35px;
            height: 35px; 
            background: #fff8e7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 26px; 
            font-weight: bold; 
            cursor: pointer; 
            touch-action: manipulation;
            position: relative;
        }
        .cell:hover { background: #ffe4b5; }
        .cell.x { color: #d32f2f; }
        .cell.o { color: #1976d2; }

        /* Winning Line */
        .win-line {
            position: absolute;
            background-color: #ffeb3b; 
            opacity: 0.7;
            z-index: 5;
            pointer-events: none;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: all 0.5s ease-in-out;
            transform-origin: left center;
        }

        /* Banner kết quả */
        #result-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 25px 50px;
            border-radius: 12px;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            display: none;
            z-index: 100;
            text-align: center;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .result-sub { font-size: 1rem; color: #ffeb3b; text-transform: none; margin-bottom: 10px; }
        
        .btn-close-banner {
            background-color: white;
            color: #333;
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-close-banner:hover { background-color: #f0f0f0; }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Responsive cho Mobile */
        @media (max-width: 800px) {
            .top-bar { justify-content: center; }
            .game-title { display: none; } 
            #status { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="panel-section">
            <h1 class="game-title">GAME CARO</h1>
            <button onclick="setMode('ai')">Chơi với Máy</button>
            <button onclick="setMode('online')">Chơi Online</button>
            <button onclick="resetGame()" style="background: #dc3545;">Chơi Lại</button>
        </div>
        
        <div class="panel-section" id="online-panel">
            <input type="text" id="my-id" readonly placeholder="Đang tạo...">
            <button onclick="copyMyId()" style="background: #28a745;">Copy Mã</button>
            <span style="color:#aaa;">|</span>
            <input type="text" id="friend-id" placeholder="VD: A1B2C3" maxlength="6">
            <button onclick="connectToFriend()">Vào Phòng</button>
        </div>
        
        <div class="panel-section">
            <div id="status" class="status-default">Máy | Lượt của X (Đỏ)</div>
        </div>
    </header>

    <div id="board-wrapper">
        <div id="board">
            <!-- Đường kẻ thắng -->
        </div>
    </div>

    <div id="result-banner">
        <span id="result-text">X THẮNG!</span>
        <div class="result-sub">Nhấn "Chơi Lại" để bắt đầu ván mới</div>
        <button class="btn-close-banner" onclick="closeBanner()">Xem lại bàn cờ</button>
    </div>

<script>
    const SIZE = 40; 
    let board = [];
    let currentTurn = 1; // 1 = X, 2 = O
    let mode = 'ai';
    let myPlayer = 1;
    let gameActive = true;
    
    let peer = null;
    let conn = null;
    let connState = 'none'; // 'none', 'waiting', 'connected', 'disconnected'
    let disconnectInterval = null; // Biến lưu vòng lặp kiểm tra kết nối

    function initBoard() {
        board = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
        const boardDiv = document.getElementById('board');
        boardDiv.innerHTML = '';
        
        const fragment = document.createDocumentFragment();
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = () => handleMove(r, c);
                fragment.appendChild(cell);
            }
        }
        boardDiv.appendChild(fragment);
        
        currentTurn = 1;
        
        if (mode === 'ai') {
            gameActive = true;
        } else if (mode === 'online' && connState === 'connected') {
            gameActive = true;
        } else {
            gameActive = false;
        }

        closeBanner(); 
        const oldLine = document.getElementById('win-line');
        if(oldLine) oldLine.remove();

        updateStatus();
        
        setTimeout(() => {
            const wrapper = document.getElementById('board-wrapper');
            const boardEl = document.getElementById('board');
            wrapper.scrollTop = (boardEl.clientHeight - wrapper.clientHeight) / 2;
            wrapper.scrollLeft = (boardEl.clientWidth - wrapper.clientWidth) / 2;
        }, 100);
    }

    function resetGame() {
        initBoard();
        if (mode === 'online' && conn && conn.open) conn.send({ type: 'reset' });
    }

    function setMode(newMode) {
        mode = newMode;
        document.getElementById('online-panel').style.display = mode === 'online' ? 'flex' : 'none';
        
        if (mode === 'ai') {
            connState = 'none';
            myPlayer = 1;
            stopConnectionCheck();
            initBoard();
        } else {
            if (!peer) {
                connState = 'waiting';
                initializePeer();
            } else {
                connState = (conn && conn.open) ? 'connected' : 'waiting';
            }
            initBoard(); 
        }
    }

    /* ===== CẬP NHẬT TRẠNG THÁI (LƯỢT ĐÁNH, ĐỢI ĐỐI PHƯƠNG, MẤT KẾT NỐI) ===== */
    function updateStatus() {
        const statusEl = document.getElementById('status');
        statusEl.className = ''; 

        if (mode === 'ai') {
            statusEl.classList.add('status-default'); // Màu xanh pastel (Máy)
            let text = "Máy | ";
            text += currentTurn === 1 ? "Lượt của X (Đỏ)" : "Lượt của O (Xanh)";
            statusEl.innerText = text;
        } else if (mode === 'online') {
            if (connState === 'waiting') {
                statusEl.classList.add('status-waiting'); // Màu vàng pastel
                statusEl.innerText = "Đang đợi đối thủ kết nối...";
            } else if (connState === 'disconnected') {
                statusEl.classList.add('status-disconnected'); // Màu đỏ pastel
                statusEl.innerText = "Mất kết nối với đối phương!";
            } else if (connState === 'connected') {
                let myChar = myPlayer === 1 ? "X (Đỏ)" : "O (Xanh)";
                let oppChar = myPlayer === 1 ? "O (Xanh)" : "X (Đỏ)";
                
                // NẾU LÀ LƯỢT CỦA MÌNH -> Báo XANH
                if (currentTurn === myPlayer) {
                    statusEl.classList.add('status-connected'); 
                    statusEl.innerText = `Lượt của BẠN - ${myChar}`;
                } 
                // NẾU LÀ LƯỢT ĐỐI PHƯƠNG -> Báo VÀNG (Đang đợi)
                else {
                    statusEl.classList.add('status-waiting');
                    statusEl.innerText = `Đang đợi đối phương - ${oppChar}...`;
                }
            }
        }
    }

    function handleMove(r, c) {
        if (!gameActive || board[r][c] !== 0) return;
        if (mode === 'online' && currentTurn !== myPlayer) return;

        placeStone(r, c, currentTurn);

        const winData = checkWinStandard(r, c, currentTurn);
        if (winData) {
            endGame(currentTurn, winData);
            if (mode === 'online' && conn && conn.open) conn.send({ type: 'move', r: r, c: c });
            return;
        }

        currentTurn = currentTurn === 1 ? 2 : 1;
        updateStatus();

        if (mode === 'online') {
            conn.send({ type: 'move', r: r, c: c });
        } else if (mode === 'ai' && currentTurn === 2) {
            setTimeout(aiMove, 50);
        }
    }

    function placeStone(r, c, player) {
        board[r][c] = player;
        const cell = document.getElementById(`cell-${r}-${c}`);
        cell.innerText = player === 1 ? 'X' : 'O';
        cell.classList.add(player === 1 ? 'x' : 'o');
    }

    function endGame(winner, winData) {
        gameActive = false; 
        let bannerText = "";

        if (mode === 'online') {
            if (winner === myPlayer) {
                bannerText = "🎉 BẠN ĐÃ THẮNG!";
                document.getElementById('result-banner').style.background = 'rgba(46, 125, 50, 0.95)';
            } else {
                bannerText = "💀 BẠN ĐÃ THUA!";
                document.getElementById('result-banner').style.background = 'rgba(211, 47, 47, 0.95)';
            }
        } else {
            if (winner === 1) {
                bannerText = "🎉 BẠN ĐÃ THẮNG AI!";
                document.getElementById('result-banner').style.background = 'rgba(46, 125, 50, 0.95)';
            } else {
                bannerText = "🤖 AI ĐÃ THẮNG!";
                document.getElementById('result-banner').style.background = 'rgba(211, 47, 47, 0.95)';
            }
        }

        const banner = document.getElementById('result-banner');
        document.getElementById('result-text').innerText = bannerText;
        banner.style.display = 'flex'; 

        if (winData) drawWinningLine(winData);
    }
    
    function closeBanner() {
        document.getElementById('result-banner').style.display = 'none';
    }

    /* KIỂM TRA THẮNG THUA - CHUẨN THI ĐẤU */
    function checkWinStandard(r, c, player) {
        const dirs = [ [1,0], [0,1], [1,1], [1,-1] ];
        for (let d of dirs) {
            let count = 1, blocks = 0;
            let startR = r, startC = c, endR = r, endC = c;

            for (let step = 1; step <= 5; step++) {
                let nr = r - d[0] * step, nc = c - d[1] * step;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) { blocks++; break; }
                if (board[nr][nc] === player) { count++; startR = nr; startC = nc; }
                else if (board[nr][nc] !== 0) { blocks++; break; } else break;
            }

            for (let step = 1; step <= 5; step++) {
                let nr = r + d[0] * step, nc = c + d[1] * step;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) { blocks++; break; }
                if (board[nr][nc] === player) { count++; endR = nr; endC = nc; }
                else if (board[nr][nc] !== 0) { blocks++; break; } else break;
            }

            if (count >= 5 && blocks < 2) {
                return { start: {r: startR, c: startC}, end: {r: endR, c: endC}, count: count };
            }
        }
        return null;
    }

    function drawWinningLine(winData) {
        const boardEl = document.getElementById('board');
        const startCell = document.getElementById(`cell-${winData.start.r}-${winData.start.c}`);
        const endCell = document.getElementById(`cell-${winData.end.r}-${winData.end.c}`);
        if (!startCell || !endCell) return;

        const startRect = startCell.getBoundingClientRect();
        const endRect = endCell.getBoundingClientRect();
        const boardRect = boardEl.getBoundingClientRect();

        const x1 = startRect.left - boardRect.left + startRect.width / 2;
        const y1 = startRect.top - boardRect.top + startRect.height / 2;
        const x2 = endRect.left - boardRect.left + endRect.width / 2;
        const y2 = endRect.top - boardRect.top + endRect.height / 2;

        const length = Math.sqrt((x2 - x1)**2 + (y2 - y1)**2);
        const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

        const line = document.createElement('div');
        line.id = 'win-line';
        line.className = 'win-line';
        line.style.width = '0px'; 
        line.style.height = '6px';
        line.style.left = `${x1}px`;
        line.style.top = `${y1 - 3}px`; 
        line.style.transform = `rotate(${angle}deg)`;

        boardEl.appendChild(line);
        setTimeout(() => { line.style.width = `${length}px`; }, 50);
    }

    /* AI LOGIC */
    function aiMove() {
        if (!gameActive) return;
        let bestScore = -Infinity;
        let move = { r: -1, c: -1 };
        let candidates = getCandidateMoves();
        
        if (candidates.length === 0) { handleMove(Math.floor(SIZE/2), Math.floor(SIZE/2)); return; }

        for (let pos of candidates) {
            let score = evaluatePositionStandard(pos.r, pos.c, 2) + evaluatePositionStandard(pos.r, pos.c, 1) * 1.1; 
            if (score > bestScore) { bestScore = score; move = pos; }
        }
        if (move.r !== -1) handleMove(move.r, move.c);
    }

    function getCandidateMoves() {
        let candidates = [];
        let hasStone = false;
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (board[r][c] !== 0) continue;
                if (hasNeighbor(r, c)) { candidates.push({r, c}); hasStone = true; }
            }
        }
        return hasStone ? candidates : [];
    }

    function hasNeighbor(r, c) {
        for (let i = -2; i <= 2; i++) {
            for (let j = -2; j <= 2; j++) {
                if (i === 0 && j === 0) continue;
                let nr = r + i, nc = c + j;
                if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] !== 0) return true;
            }
        }
        return false;
    }

    function evaluatePositionStandard(r, c, player) {
        let score = 0;
        const dirs = [ [1,0], [0,1], [1,1], [1,-1] ];
        for (let d of dirs) {
            let consecutive = 1, blocks = 0;
            for (let step = 1; step <= 4; step++) {
                let nr = r + d[0] * step, nc = c + d[1] * step;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) { blocks++; break; }
                if (board[nr][nc] === player) consecutive++;
                else if (board[nr][nc] !== 0) { blocks++; break; } else break;
            }
            for (let step = 1; step <= 4; step++) {
                let nr = r - d[0] * step, nc = c - d[1] * step;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) { blocks++; break; }
                if (board[nr][nc] === player) consecutive++;
                else if (board[nr][nc] !== 0) { blocks++; break; } else break;
            }

            if (consecutive >= 5 && blocks < 2) score += 100000;
            else if (consecutive === 4 && blocks === 0) score += 10000;
            else if (consecutive === 4 && blocks === 1) score += 1000;
            else if (consecutive === 3 && blocks === 0) score += 1000;
            else if (consecutive === 3 && blocks === 1) score += 100;
            else if (consecutive === 2 && blocks === 0) score += 100;
            else if (consecutive === 2 && blocks === 1) score += 10;
        }
        return score;
    }

    function generateAlphaNumericId(length) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    /* ===== WEBRTC PEERJS ===== */
    function initializePeer() {
        const randomId = generateAlphaNumericId(6);
        peer = new Peer(randomId); 

        peer.on('open', (id) => { 
            document.getElementById('my-id').value = id; 
        });

        peer.on('connection', (connection) => {
            conn = connection;
            connState = 'connected';
            setupConnectionLogic();
            myPlayer = 1; 
            alert("Bạn bè đã vào phòng! Bạn là X (Đi trước).");
            initBoard(); 
        });

        peer.on('error', (err) => { 
            if (err.type === 'unavailable-id') {
                initializePeer();
            } else {
                handleDisconnect();
            }
        });
        
        peer.on('disconnected', () => {
            handleDisconnect();
        });
    }

    function connectToFriend() {
        const friendId = document.getElementById('friend-id').value.trim().toUpperCase();
        if (!friendId || friendId.length !== 6) return alert("Vui lòng nhập đúng MÃ PHÒNG gồm 6 KÝ TỰ!");
        
        connState = 'waiting';
        updateStatus();
        
        conn = peer.connect(friendId);
        
        conn.on('open', () => {
            connState = 'connected';
            setupConnectionLogic();
            myPlayer = 2; 
            alert("Kết nối thành công! Bạn là O (Đi sau).");
            initBoard();
        });
        
        conn.on('close', handleDisconnect);
        conn.on('error', handleDisconnect);
    }

    /* HÀM XỬ LÝ KHI NGẮT KẾT NỐI */
    function handleDisconnect() {
        connState = 'disconnected';
        gameActive = false; // Khóa bàn cờ lại
        updateStatus();
        stopConnectionCheck();
    }

    function stopConnectionCheck() {
        if (disconnectInterval) {
            clearInterval(disconnectInterval);
            disconnectInterval = null;
        }
    }

    /* THEO DÕI VÀ XỬ LÝ LOGIC TRONG TRẬN */
    function setupConnectionLogic() {
        gameActive = true;
        
        // LUÔN LUÔN KIỂM TRA TRẠNG THÁI MẠNG (Đề phòng trường hợp đối phương tắt thẳng tab)
        stopConnectionCheck();
        disconnectInterval = setInterval(() => {
            if (mode === 'online' && connState === 'connected') {
                if (!conn || !conn.open || (conn.peerConnection && ['disconnected', 'failed', 'closed'].includes(conn.peerConnection.iceConnectionState))) {
                    handleDisconnect();
                }
            }
        }, 1500);
        
        conn.on('data', (data) => {
            if (data.type === 'move') {
                placeStone(data.r, data.c, currentTurn);
                const winData = checkWinStandard(data.r, data.c, currentTurn);
                if (winData) {
                    endGame(currentTurn, winData);
                } else { 
                    currentTurn = currentTurn === 1 ? 2 : 1; 
                    updateStatus(); 
                }
            } else if (data.type === 'reset') {
                initBoard();
            }
        });
        
        // Bắt lỗi thoát ra
        conn.on('close', handleDisconnect);
        conn.on('error', handleDisconnect);
    }

    function copyMyId() {
        const idInput = document.getElementById('my-id');
        idInput.select();
        document.execCommand('copy');
        alert("Đã copy mã: " + idInput.value);
    }

    initBoard();
</script>

</body>
</html>
